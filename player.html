<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Qwen3-ASR Transcript Player</title>
<style>
  :root {
    --bg: #fafafa;
    --fg: #222;
    --muted: #888;
    --accent: #ffd83b;
    --active: #ffb300;
    --border: #ddd;
    --silence: #e9ecef;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.9;
  }
  header {
    position: sticky;
    top: 0;
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    z-index: 10;
  }
  .controls {
    display: flex;
    gap: 16px;
    align-items: center;
    flex-wrap: wrap;
    margin-top: 8px;
    font-size: 13px;
    color: var(--muted);
  }
  .controls label { display: flex; align-items: center; gap: 6px; }
  .controls input[type="range"] { width: 140px; }
  button {
    border: 1px solid var(--border); background: #fff; padding: 4px 10px;
    border-radius: 4px; cursor: pointer; font-size: 13px;
  }
  button.on { background: var(--accent); border-color: var(--active); color: #000; }
  .drop {
    padding: 40px 20px;
    margin: 20px;
    border: 2px dashed var(--border);
    border-radius: 8px;
    text-align: center;
    color: var(--muted);
    cursor: pointer;
  }
  .drop.hover { border-color: var(--active); background: #fffbe6; }
  .drop.hidden { display: none; }
  .api-panel {
    margin: 20px;
    padding: 16px 20px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    font-size: 13px;
  }
  .api-panel h3 { margin: 0 0 10px; font-size: 14px; font-weight: 600; }
  .api-panel .row {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .api-panel input[type="text"] {
    flex: 1; min-width: 180px; padding: 5px 8px;
    border: 1px solid var(--border); border-radius: 4px; font-size: 13px;
  }
  .api-panel label { color: var(--muted); white-space: nowrap; }
  .api-panel button.primary {
    background: var(--active); border-color: var(--active); color: #000; font-weight: 600;
  }
  .api-panel button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .api-status { color: var(--muted); }
  .api-status.err { color: #d33; }
  .api-status.ok { color: #2a9d3f; }
  audio { width: 100%; margin-top: 8px; }
  main { padding: 20px 24px 120px; }

  /* === Flow view === */
  #flow .word {
    display: inline-block;
    padding: 1px 2px;
    margin: 0 1px;
    border-radius: 3px;
    cursor: pointer;
    transition: background 0.1s;
    vertical-align: baseline;
  }
  #flow .word:hover { background: var(--accent); }
  #flow .word.active { background: var(--active); color: #000; }
  #flow .gap {
    display: inline-block;
    height: 0.6em;
    background: var(--silence);
    border-radius: 3px;
    vertical-align: middle;
    margin: 0 4px;
  }
  #flow .gap.line-break { display: block; height: 6px; margin: 6px 0; }

  /* === Timeline view === */
  #timeline { display: none; }
  .tl-row {
    position: relative;
    height: 48px;
    border-bottom: 1px dashed var(--border);
    margin-bottom: 4px;
  }
  .tl-time {
    position: absolute;
    left: 0; top: -14px;
    font-size: 10px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .tl-word {
    position: absolute;
    bottom: 4px;
    padding: 1px 2px;
    border-radius: 3px;
    cursor: pointer;
    white-space: nowrap;
    line-height: 1.1;
    transition: background 0.1s;
  }
  .tl-word:hover { background: var(--accent); z-index: 2; }
  .tl-word.active { background: var(--active); color: #000; z-index: 3; }
  .playhead {
    position: absolute;
    top: -4px;
    bottom: -4px;
    width: 2px;
    background: #ff3860;
    pointer-events: none;
    z-index: 5;
    box-shadow: 0 0 4px rgba(255, 56, 96, 0.6);
  }
  .playhead::before {
    content: '';
    position: absolute;
    top: -4px; left: -4px;
    width: 10px; height: 10px;
    background: #ff3860;
    border-radius: 50%;
  }

  .meta { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .hint { font-size: 12px; color: var(--muted); }
  kbd {
    background: #eee; border: 1px solid #ccc; border-radius: 3px;
    padding: 1px 5px; font-size: 11px;
  }
</style>
</head>
<body>
<header>
  <audio id="audio" controls></audio>
  <div class="controls">
    <button id="btn-flow" class="on">Flow</button>
    <button id="btn-timeline">Timeline</button>
    <label id="ctl-gap">Silence threshold <input id="gap-thresh" type="range" min="0.1" max="2" step="0.1" value="0.4"><span id="gap-val">0.4s</span></label>
    <label id="ctl-window" style="display:none">Row span <input id="window-sec" type="range" min="4" max="20" step="1" value="8"><span id="window-val">8s</span></label>
    <span class="hint"><kbd>Space</kbd> play/pause <kbd>←</kbd>/<kbd>→</kbd> skip 5s</span>
  </div>
  <div class="meta"><span id="status">Load an audio file and a result.json to begin.</span></div>
</header>

<div id="drop" class="drop">
  <p><strong>Click</strong> or <strong>drag &amp; drop</strong><br>
  an audio file (.wav/.mp3) and a result.json. Or drop audio alone and call the API below.</p>
  <input id="file" type="file" multiple accept="audio/*,application/json,.json" hidden>
</div>

<div class="api-panel">
  <h3>Transcribe via API</h3>
  <div class="row">
    <label>Base URL</label>
    <input id="api-url" type="text" value="http://localhost:8000">
  </div>
  <div class="row">
    <label>Source</label>
    <label><input type="radio" name="api-src" value="upload" checked> Upload file</label>
    <label><input type="radio" name="api-src" value="path"> Server path</label>
    <input id="api-path" type="text" placeholder="/absolute/path/on/server.wav" style="flex:1; display:none">
  </div>
  <div class="row" id="api-path-hint" style="display:none; color:var(--muted); font-size:12px">
    <span id="api-path-hint-text"></span>
  </div>
  <div class="row">
    <label>Language</label>
    <input id="api-language" type="text" value="Japanese" style="flex:0 0 140px">
    <label>Context</label>
    <input id="api-context" type="text" placeholder="proper nouns / hotwords (optional)">
  </div>
  <div class="row">
    <label><input id="api-stream" type="checkbox" checked> Stream (chunk-by-chunk)</label>
    <label>Chunk seconds <input id="api-chunk" type="number" min="10" max="600" step="10" value="60" style="width:70px"></label>
    <label><input id="api-follow" type="checkbox"> Live (follow growing file)</label>
    <label id="api-idle-wrap" style="display:none">Idle timeout <input id="api-idle" type="number" min="2" max="120" step="1" value="15" style="width:60px">s</label>
  </div>
  <div class="row">
    <button id="api-submit" class="primary" disabled>Send transcription request</button>
    <button id="api-cancel" style="display:none">Cancel</button>
    <span id="api-status" class="api-status">Load an audio file above first.</span>
  </div>
  <div id="api-progress-wrap" style="display:none; margin-top:8px">
    <div style="height:6px; background:#eee; border-radius:3px; overflow:hidden">
      <div id="api-progress-bar" style="height:100%; width:0; background:var(--active); transition:width 0.2s"></div>
    </div>
  </div>
</div>

<main>
  <div id="flow"></div>
  <div id="timeline"></div>
</main>

<script>
const audio = document.getElementById('audio');
const drop = document.getElementById('drop');
const fileInput = document.getElementById('file');
const flowEl = document.getElementById('flow');
const timelineEl = document.getElementById('timeline');
const statusEl = document.getElementById('status');
const btnFlow = document.getElementById('btn-flow');
const btnTl = document.getElementById('btn-timeline');
const gapRange = document.getElementById('gap-thresh');
const gapVal = document.getElementById('gap-val');
const winRange = document.getElementById('window-sec');
const winVal = document.getElementById('window-val');
const ctlGap = document.getElementById('ctl-gap');
const ctlWin = document.getElementById('ctl-window');

let words = [];
let wordEls = [];       // flow view word elements
let tlWordEls = [];     // timeline view word elements
let currentIdx = -1;
let mode = 'flow';
let playhead = null;
let rafId = 0;
let currentAudioFile = null;  // File reference kept around for API submission

const apiUrl = document.getElementById('api-url');
const apiLanguage = document.getElementById('api-language');
const apiContext = document.getElementById('api-context');
const apiSubmit = document.getElementById('api-submit');
const apiCancel = document.getElementById('api-cancel');
const apiStatus = document.getElementById('api-status');
const apiStream = document.getElementById('api-stream');
const apiChunk = document.getElementById('api-chunk');
const apiPath = document.getElementById('api-path');
const apiPathHint = document.getElementById('api-path-hint');
const apiPathHintText = document.getElementById('api-path-hint-text');
const apiSourceRadios = document.getElementsByName('api-src');
const apiFollow = document.getElementById('api-follow');
const apiIdle = document.getElementById('api-idle');
const apiIdleWrap = document.getElementById('api-idle-wrap');

apiFollow.addEventListener('change', () => {
  apiIdleWrap.style.display = apiFollow.checked ? '' : 'none';
});

let serverAudioRoot = null;

async function fetchServerInfo() {
  try {
    const r = await fetch(apiBase() + '/health');
    if (!r.ok) return;
    const h = await r.json();
    serverAudioRoot = h.audio_root || null;
    if (serverAudioRoot) {
      apiPath.placeholder = `relative/to/${serverAudioRoot.split('/').pop() || 'root'}.wav`;
      apiPathHintText.textContent = `AUDIO_ROOT = ${serverAudioRoot} — relative paths are resolved against it.`;
    } else {
      apiPath.placeholder = '/absolute/path/on/server.wav';
      apiPathHintText.textContent = 'AUDIO_ROOT is unset on the server — absolute paths only.';
    }
  } catch (e) {
    apiPathHintText.textContent = `Cannot reach ${apiBase()}/health (${e.message}).`;
  }
}
const apiProgressWrap = document.getElementById('api-progress-wrap');
const apiProgressBar = document.getElementById('api-progress-bar');
let activeAbort = null;

function apiSourceMode() {
  for (const r of apiSourceRadios) if (r.checked) return r.value;
  return 'upload';
}
function refreshSubmitEnabled() {
  const mode = apiSourceMode();
  if (mode === 'upload') {
    apiSubmit.disabled = !currentAudioFile;
  } else {
    apiSubmit.disabled = !apiPath.value.trim();
  }
}
function loadAudioFromServerPath() {
  const p = apiPath.value.trim();
  if (!p) return;
  const url = apiBase() + '/audio?path=' + encodeURIComponent(p);
  audio.src = url;
  currentAudioFile = null;
  setApiStatus(`Audio source: ${p} (via ${apiBase()}/audio)`);
}
for (const r of apiSourceRadios) {
  r.addEventListener('change', () => {
    const mode = apiSourceMode();
    apiPath.style.display = mode === 'path' ? '' : 'none';
    apiPathHint.style.display = mode === 'path' ? 'block' : 'none';
    if (mode === 'path') {
      fetchServerInfo();
      loadAudioFromServerPath();
    }
    refreshSubmitEnabled();
  });
}
apiUrl.addEventListener('change', () => {
  if (apiSourceMode() === 'path') fetchServerInfo();
});
apiPath.addEventListener('input', refreshSubmitEnabled);
apiPath.addEventListener('change', () => {
  if (apiSourceMode() === 'path') loadAudioFromServerPath();
});

function setStatus(msg) { statusEl.textContent = msg; }

// Font size scales with speaking rate (sec/char), clamped so nothing gets unreadable.
const FONT_MIN_PX = 9;
const FONT_MAX_PX = 13;
function fontSizeFor(word, baseSize = 12) {
  const chars = Math.max(word.text.length, 1);
  const secPerChar = (word.end - word.start) / chars;
  const ratio = Math.sqrt(secPerChar / 0.12);
  return Math.max(FONT_MIN_PX, Math.min(FONT_MAX_PX, baseSize * ratio));
}

function renderFlow() {
  flowEl.innerHTML = '';
  wordEls = [];
  const gapThresh = parseFloat(gapRange.value);
  const totalDur = words.length ? words[words.length - 1].end : 0;
  const baseSize = 16;

  words.forEach((w, i) => {
    const prev = i > 0 ? words[i - 1] : null;
    if (prev) {
      const gap = w.start - prev.end;
      if (gap >= gapThresh) {
        const gapEl = document.createElement('span');
        // Visualize the silence gap: width proportional to duration (capped at 200px).
        const width = Math.min(200, gap * 40);
        const isLong = gap >= 1.0;
        gapEl.className = 'gap' + (isLong ? ' line-break' : '');
        if (isLong) {
          gapEl.style.width = Math.min(100, gap * 20) + '%';
        } else {
          gapEl.style.width = width + 'px';
        }
        gapEl.title = `silence ${gap.toFixed(2)}s`;
        flowEl.appendChild(gapEl);
      }
    }
    const span = document.createElement('span');
    span.className = 'word';
    span.textContent = w.text;
    span.dataset.idx = i;
    span.style.fontSize = fontSizeFor(w, baseSize) + 'px';
    span.title = `${w.start.toFixed(2)}s – ${w.end.toFixed(2)}s (${w.text.length} chars / ${(w.end - w.start).toFixed(2)}s)`;
    span.addEventListener('click', () => {
      audio.currentTime = w.start;
      audio.play();
    });
    flowEl.appendChild(span);
    wordEls.push(span);
  });
  setStatus(`${words.length} words / ${totalDur.toFixed(1)}s`);
}

function renderTimeline() {
  timelineEl.innerHTML = '';
  tlWordEls = new Array(words.length);
  if (!words.length) return;
  const windowSec = parseFloat(winRange.value);
  const totalDur = words[words.length - 1].end;
  const numRows = Math.ceil(totalDur / windowSec);

  const rows = [];
  for (let r = 0; r < numRows; r++) {
    const row = document.createElement('div');
    row.className = 'tl-row';
    const t = document.createElement('div');
    t.className = 'tl-time';
    const rowStart = r * windowSec;
    t.textContent = formatTime(rowStart);
    row.appendChild(t);
    timelineEl.appendChild(row);
    rows.push(row);
  }

  words.forEach((w, i) => {
    const rowIdx = Math.floor(w.start / windowSec);
    if (rowIdx >= rows.length) return;
    const rowStart = rowIdx * windowSec;
    const leftPct = ((w.start - rowStart) / windowSec) * 100;
    const widthPct = Math.max(0.5, ((w.end - w.start) / windowSec) * 100);
    const span = document.createElement('span');
    span.className = 'tl-word';
    span.textContent = w.text;
    span.style.left = leftPct + '%';
    span.style.minWidth = widthPct + '%';
    span.style.fontSize = fontSizeFor(w, 15) + 'px';
    span.title = `${w.start.toFixed(2)}s – ${w.end.toFixed(2)}s`;
    span.addEventListener('click', () => {
      audio.currentTime = w.start;
      audio.play();
    });
    rows[rowIdx].appendChild(span);
    tlWordEls[i] = span;
  });
  setStatus(`${words.length} words / ${totalDur.toFixed(1)}s / ${windowSec}s per row × ${numRows} rows`);
}

function formatTime(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${m}:${sec.toString().padStart(2, '0')}`;
}

function renderAll() {
  if (!words.length) return;
  renderFlow();
  renderTimeline();
  currentIdx = -1;
  updateActive();
}

function render(data) {
  words = data.words || [];
  renderAll();
}

function updateActive() {
  if (!words.length) return;
  const t = audio.currentTime;
  let lo = 0, hi = words.length - 1, idx = -1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (words[mid].start <= t && t < words[mid].end) { idx = mid; break; }
    if (t < words[mid].start) hi = mid - 1;
    else lo = mid + 1;
  }
  if (idx === currentIdx) return;
  const prev = currentIdx;
  currentIdx = idx;
  const activeList = mode === 'flow' ? wordEls : tlWordEls;
  if (prev >= 0 && activeList[prev]) activeList[prev].classList.remove('active');
  if (idx >= 0 && activeList[idx]) {
    activeList[idx].classList.add('active');
    const rect = activeList[idx].getBoundingClientRect();
    if (rect.top < 80 || rect.bottom > window.innerHeight - 40) {
      activeList[idx].scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }
}

function switchMode(m) {
  mode = m;
  if (m === 'flow') {
    btnFlow.classList.add('on'); btnTl.classList.remove('on');
    flowEl.style.display = 'block'; timelineEl.style.display = 'none';
    ctlGap.style.display = 'flex'; ctlWin.style.display = 'none';
  } else {
    btnFlow.classList.remove('on'); btnTl.classList.add('on');
    flowEl.style.display = 'none'; timelineEl.style.display = 'block';
    ctlGap.style.display = 'none'; ctlWin.style.display = 'flex';
  }
  // Re-apply active word highlight in the newly visible view.
  wordEls.forEach(e => e && e.classList.remove('active'));
  tlWordEls.forEach(e => e && e.classList.remove('active'));
  currentIdx = -1;
  updateActive();
  updatePlayhead();
}

btnFlow.addEventListener('click', () => switchMode('flow'));
btnTl.addEventListener('click', () => switchMode('timeline'));
gapRange.addEventListener('input', () => { gapVal.textContent = gapRange.value + 's'; renderFlow(); });
winRange.addEventListener('input', () => { winVal.textContent = winRange.value + 's'; playhead = null; renderTimeline(); updatePlayhead(); });

function updatePlayhead() {
  if (mode !== 'timeline' || !words.length) {
    if (playhead) playhead.style.display = 'none';
    return;
  }
  const windowSec = parseFloat(winRange.value);
  const t = audio.currentTime;
  const rowIdx = Math.floor(t / windowSec);
  const rows = timelineEl.querySelectorAll('.tl-row');
  if (rowIdx >= rows.length) {
    if (playhead) playhead.style.display = 'none';
    return;
  }
  if (!playhead) {
    playhead = document.createElement('div');
    playhead.className = 'playhead';
  }
  const targetRow = rows[rowIdx];
  if (playhead.parentElement !== targetRow) targetRow.appendChild(playhead);
  const leftPct = ((t - rowIdx * windowSec) / windowSec) * 100;
  playhead.style.left = leftPct + '%';
  playhead.style.display = 'block';
}

function tick() {
  updateActive();
  updatePlayhead();
  if (!audio.paused) rafId = requestAnimationFrame(tick);
}

audio.addEventListener('timeupdate', () => { updateActive(); updatePlayhead(); });
audio.addEventListener('play', () => { cancelAnimationFrame(rafId); rafId = requestAnimationFrame(tick); });
audio.addEventListener('pause', () => { cancelAnimationFrame(rafId); updatePlayhead(); });
audio.addEventListener('seeked', updatePlayhead);

async function handleFiles(files) {
  for (const f of files) {
    if (f.type.startsWith('audio/') || /\.(wav|mp3|m4a|flac|ogg)$/i.test(f.name)) {
      audio.src = URL.createObjectURL(f);
      currentAudioFile = f;
      setApiStatus(`Audio loaded: ${f.name} (${(f.size / 1024 / 1024).toFixed(1)} MB)`);
    } else if (f.name.endsWith('.json') || f.type === 'application/json') {
      const text = await f.text();
      try { render(JSON.parse(text)); drop.classList.add('hidden'); }
      catch (e) { setStatus('JSON parse failed: ' + e.message); }
    }
  }
  refreshSubmitEnabled();
}

function setApiStatus(msg, level = '') {
  apiStatus.textContent = msg;
  apiStatus.className = 'api-status' + (level ? ' ' + level : '');
}

function buildFormData() {
  const fd = new FormData();
  if (apiSourceMode() === 'path') {
    fd.append('path', apiPath.value.trim());
  } else {
    fd.append('file', currentAudioFile);
  }
  fd.append('language', apiLanguage.value.trim() || 'Japanese');
  const ctx = apiContext.value.trim();
  if (ctx) fd.append('context', ctx);
  return fd;
}

function apiBase() {
  return apiUrl.value.trim().replace(/\/$/, '');
}

function setProgress(frac) {
  if (frac === null) {
    apiProgressWrap.style.display = 'none';
    return;
  }
  apiProgressWrap.style.display = 'block';
  apiProgressBar.style.width = Math.min(100, Math.max(0, frac * 100)) + '%';
}

function beginRequest() {
  apiSubmit.disabled = true;
  apiCancel.style.display = '';
  activeAbort = new AbortController();
}

function endRequest() {
  apiSubmit.disabled = false;
  apiCancel.style.display = 'none';
  activeAbort = null;
}

apiCancel.addEventListener('click', () => {
  if (activeAbort) activeAbort.abort();
});

async function submitOneShot() {
  const url = apiBase() + '/transcribe';
  setApiStatus('Transcribing... (this can take several minutes for long audio)');
  setProgress(null);
  const t0 = performance.now();
  const res = await fetch(url, { method: 'POST', body: buildFormData(), signal: activeAbort.signal });
  if (!res.ok) throw new Error(`HTTP ${res.status}: ${(await res.text()).slice(0, 200)}`);
  const data = await res.json();
  const wall = ((performance.now() - t0) / 1000).toFixed(1);
  setApiStatus(
    `Done in ${wall}s (ASR ${data.asr_seconds.toFixed(1)}s + Align ${data.align_seconds.toFixed(1)}s)`,
    'ok'
  );
  render(data);
  drop.classList.add('hidden');
}

// Parse an SSE stream, calling onEvent({event, data}) for each frame.
async function* parseSSE(reader) {
  const decoder = new TextDecoder('utf-8');
  let buffer = '';
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    let sep;
    while ((sep = buffer.indexOf('\n\n')) !== -1) {
      const frame = buffer.slice(0, sep);
      buffer = buffer.slice(sep + 2);
      let ev = 'message';
      const dataLines = [];
      for (const line of frame.split('\n')) {
        if (line.startsWith('event:')) ev = line.slice(6).trim();
        else if (line.startsWith('data:')) dataLines.push(line.slice(5).trimStart());
      }
      if (dataLines.length === 0) continue;
      let payload;
      try { payload = JSON.parse(dataLines.join('\n')); }
      catch { payload = dataLines.join('\n'); }
      yield { event: ev, data: payload };
    }
  }
}

async function submitStreaming() {
  const url = apiBase() + '/transcribe-stream';
  const fd = buildFormData();
  fd.append('chunk_duration', String(parseFloat(apiChunk.value) || 60));
  const isFollow = apiFollow.checked && apiSourceMode() === 'path';
  if (isFollow) {
    fd.append('follow', 'true');
    fd.append('idle_timeout_seconds', String(parseFloat(apiIdle.value) || 8));
  }
  setApiStatus('Connecting...');
  if (isFollow) setProgress(null); else setProgress(0);
  words = [];
  renderAll();

  const t0 = performance.now();
  const res = await fetch(url, { method: 'POST', body: fd, signal: activeAbort.signal });
  if (!res.ok) throw new Error(`HTTP ${res.status}: ${(await res.text()).slice(0, 200)}`);

  let total = 0;
  let processed = 0;
  let backend = '';
  let chunkCount = 0;
  let chunkIdx = 0;
  let followMode = false;
  for await (const { event, data } of parseSSE(res.body.getReader())) {
    if (event === 'start') {
      total = data.total_duration || 0;
      chunkCount = data.chunk_count || 0;
      backend = data.backend || '';
      followMode = !!data.follow;
      if (followMode) {
        setApiStatus(`Live stream from ${backend} (start offset ${(data.start_offset || 0).toFixed(1)}s, idle ${data.idle_timeout_seconds}s)...`);
      } else if (chunkCount) {
        setApiStatus(`Streaming from ${backend} (${chunkCount} chunks, ${total.toFixed(1)}s total)...`);
      } else {
        setApiStatus(`Streaming from ${backend} (${total ? total.toFixed(1) + 's total' : 'unknown duration'})...`);
      }
      drop.classList.add('hidden');
    } else if (event === 'chunk') {
      words = words.concat(data.words || []);
      renderAll();
      chunkIdx += 1;
      processed = (data.chunk_start || 0) + (data.chunk_duration || 0);
      if (followMode) {
        const wall = ((performance.now() - t0) / 1000).toFixed(0);
        setApiStatus(`LIVE: ${chunkIdx} chunks, processed up to ${processed.toFixed(1)}s (wall ${wall}s)`);
      } else if (chunkCount) {
        setProgress(total > 0 ? processed / total : 0);
        setApiStatus(`Chunk ${chunkIdx}/${chunkCount} @ ${processed.toFixed(1)}s / ${total.toFixed(1)}s`);
      } else {
        setApiStatus(`Chunk ${chunkIdx} @ ${processed.toFixed(1)}s`);
      }
    } else if (event === 'done') {
      const wall = ((performance.now() - t0) / 1000).toFixed(1);
      const reason = data.reason ? ` [${data.reason}]` : '';
      setApiStatus(
        `Done in ${wall}s${reason} (ASR ${data.total_asr_seconds.toFixed(1)}s, ${data.total_words} words)`,
        'ok'
      );
      if (!followMode) setProgress(1);
    } else if (event === 'error') {
      throw new Error(data.message || 'stream error');
    }
  }
}

async function submitToApi() {
  const mode = apiSourceMode();
  if (mode === 'upload' && !currentAudioFile) {
    setApiStatus('No audio file loaded.', 'err'); return;
  }
  if (mode === 'path' && !apiPath.value.trim()) {
    setApiStatus('Server path is empty.', 'err'); return;
  }
  const url = apiUrl.value.trim();
  if (!url) { setApiStatus('Base URL is empty.', 'err'); return; }

  beginRequest();
  try {
    if (apiStream.checked) {
      await submitStreaming();
    } else {
      await submitOneShot();
    }
  } catch (e) {
    if (e.name === 'AbortError') setApiStatus('Cancelled.', 'err');
    else setApiStatus('Error: ' + e.message, 'err');
  } finally {
    endRequest();
  }
}

apiSubmit.addEventListener('click', submitToApi);

drop.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => handleFiles(e.target.files));

['dragenter', 'dragover'].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('hover'); })
);
['dragleave', 'drop'].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('hover'); })
);
drop.addEventListener('drop', e => handleFiles(e.dataTransfer.files));
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => { e.preventDefault(); handleFiles(e.dataTransfer.files); });

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.code === 'Space') { e.preventDefault(); audio.paused ? audio.play() : audio.pause(); }
  else if (e.code === 'ArrowLeft') { audio.currentTime = Math.max(0, audio.currentTime - 5); }
  else if (e.code === 'ArrowRight') { audio.currentTime = Math.min(audio.duration, audio.currentTime + 5); }
});
</script>
